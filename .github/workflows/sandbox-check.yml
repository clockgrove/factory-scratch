name: Sandbox check
# On demand: Factory's local-mode sandbox bar, probed on hosted Linux, macOS and Windows (clockgrove/factory
# bench/sandbox-check.mjs). Not part of any PR's checks.
on:
  workflow_dispatch:
    inputs:
      ref: { description: "clockgrove/factory ref to check", required: false, default: main }
      harness: { description: "Comma list of srt, claude, codex, copilot", required: false, default: "srt,claude,codex,copilot" }
permissions: { contents: read }
jobs:
  check:
    strategy: { fail-fast: false, matrix: { os: [ubuntu-latest, macos-latest, windows-latest] } }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { repository: clockgrove/factory, ref: "${{ inputs.ref }}", path: factory, persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: Sandbox tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat ripgrep slirp4netns iptables
          # Ubuntu 24.04 restricts unprivileged user namespaces, which every one of these sandboxes needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Sandbox tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Harness CLIs
        if: runner.os != 'Windows'
        run: npm install -g @anthropic-ai/sandbox-runtime @anthropic-ai/claude-code @openai/codex @github/copilot
      - name: Check
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: node factory/bench/sandbox-check.mjs --harness "${{ inputs.harness }}" --json sandbox-check.json
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "sandbox-check-${{ matrix.os }}", path: sandbox-check.json, if-no-files-found: ignore }
