# Proof for clockgrove/factory#2579: a harmless comment that changes this workflow file on main mid-run.
# The repository's own CI: runs on every PR and on the merge queue's commit, so a
# required check named `quality` gates merges to main. The setup script is the same one
# Factory runs before the worker: it is deliberately heavy (PostgreSQL with pgvector built
# from source), so the runner path carries real setup minutes.
name: Quality
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04 # ubuntu-latest moved to 26.04, where setup.sh's PostgreSQL packages conflict
    steps:
      # Proof for clockgrove/factory#2597 (this branch never merges): green on the PR, red on every merge_group commit,
      # so the merge queue drops the PR each time it is enqueued.
      - run: test "${{ github.event_name }}" != merge_group
